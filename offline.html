<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta httpEquiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sadhguru App| Isha Sadhguru</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
<style>
  *{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: sans-serif !important;
  }
  .headerComponent{
    padding: 0;
    margin: 0 auto;
    width: 100%;
    max-width: 1300px;

    /* overflow: hidden; */
  }
  header{
    width: 100%;
    height: 75px;
    max-height: 75px;
    display: flex;
    margin: 0;
    padding: 0;
    align-items: center;
  }
  nav{
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    padding: 0 20px;
    justify-content: flex-start;
    background-color: #e4ded4;
  }
  .logo{
    width: 62px;
    height: 57px;
    max-width: 62px;
    /* max-height: 57px !important; */
    padding: 0;
    margin:0 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo img{
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }

  .navbar{
    display: flex;
    width: 80%;
    align-items: center;
    justify-content: space-around;
  }
  .navLinks{
    list-style: none;
    display: flex;
    /* align-items: center; */
    
  }
  .navLinksSecond{
    list-style: none;
    display: flex;
    align-items: center;
    font-size: 16px;
    
  }
 .navLinkItem{

  display: block;
    position: relative;
    padding-top: 17px;
    padding-bottom: 18px;
    border-bottom: 7px solid transparent;
}
  

  .navLinkItem a{
    display: block;
    /* font-family: 'FedraSansStd-medium', sans-serif; */
    font-size: 16px;
    line-height: 30px;
    color: #3c3c3c;
    text-decoration: none;
    padding: 0 5px;
    border-right: solid 1px #a39d93;
    cursor: pointer;
    /* position: relative; */
  }
   /* .navLinksSecond .navLinkItem:hover{
      color: #cf4520;
      border-bottom:5px solid #cf4520;
      
      
  } */
 .navLinkItem:hover{
      color: #cf4520;
      border-bottom:7px solid #cf4520;
     
  }
  .navLinkItemContent{
    display: none;
    position: absolute;
    z-index: 1;
    top: 57px;
    color: #3c3c3c;
    transition: 4s linear;
font-size: 16px;
  }
  .subItems ul{
      list-style: none;
      margin: 0;
      padding: 0;
  }
  .subItems ul li{
    display: block;
    /* font-family: 'FedraSansStd-book', sans-serif; */
    font-size: 16px;
    line-height: 30px;
    color: #3c3c3c;
    cursor: pointer;
    text-decoration: none;
    padding: 10px 15px;
    font-weight: 300;
    border-right: 0;
  }
  
  .subItems ul li:hover{
    color: #cf4520;
    background-color: #e4ded4;
  } 
  .navLinks .navLinkItem:hover .navLinkItemContent{
      color: #cf4520;
      display: block;
  }
  .navLinksSecond .navLinkItem:hover .navLinkItemContent{
    display: block;
    width: auto;
    height: 100%;
  }
  .menuIcon{
    display: none;
    font-size: 30px;
    text-align: center;
    font-weight: 100;
    position: absolute;
    top: 20px;
    right: 100px;
  }
 @media only screen and (max-width:1000px) {
  *{
    text-align: left;
  }
  .menuIcon{
    display: block;
  }
  .navLinksSecond{
    display: none;
  }
  .navLinks{
    display: none;
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    text-align: left;
  }
  .navLinkItem{
    outline: 2px solid transparent;
    outline-offset: 2px;
    color: #000;
    display: block;
    min-height: 60px;
    height: auto;
    /* font-family: 'FedraSansStd-medium','sans-serif'; */
    font-size: 20px;
    /* padding: 15px 25px; */
    /* border-bottom: solid 1px #faf7f0; */
  }
  .navLinkItem:hover{
      color: black;
      text-decoration: underline;
      
      border-bottom:7px solid transparent;
     
  }
  .navLinks .navLinkItem:hover .navLinkItemContent{
      color: #cf4520;
      display: none;
  }
  .navLinksSecond .navLinkItem:hover .navLinkItemContent{
    display: none;
    width: auto;
    height: 100%;
  }
  .Active{
    display: block;
  }
  .hide{
    display: none;
  }
 
  .breadCrumContent{
    display: none;
  }
  .topBar{
  margin: 0;
  padding: 0;
  display: none;
 }
 
 }
 @media only screen and (max-width:600px) {
  .logo{
    width: 46px;
    height: 43px;
    margin-top: 10px;
  }
 }
 .topBar{
  margin: 0;
  padding: 0;
 }
 .container{
  width: 100%;
  height: auto;
 }
 .topBarContent{
  width: 100%;
  background-color: #000;
  opacity: 0.8;
  height: 42px;
  
 }
 .tobBarItem{
  display: flex;
  justify-content: flex-end;

  max-width: 1200px;
 margin: 0 auto;
 }
 .tobBarItem img{
  width: 40px;
    height: 40px;
 }
.tobBarLink{
  display: inline-block;
  color: #8a806f;
  /* font-family: 'FedraSansStd-medium',sans-serif; */
              font-size: 11px;
}
.tobBarLink:hover{
  
  color: #cf4520;
  
}
.dark{
  color: #cca146;
}
.dark:hover{
  color: #cf4520;
}
.breadCrum{
  width: 100%;
  height: auto;
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}
.breadCrumContainer{
  padding: 9px calc((100% - 1134px) / 2) 9px calc((100% - 1134px) / 2);
  /* font-family: FedraSansStd-book; */
    font-size: 13px;
    letter-spacing: .2px;
    color: rgb(0 0 0);
    position: relative;
    width: 100%;
    background: rgba(250,247,240,.6);
    height: 40px;
    text-align: left;
}
.breadCrumContent{
  padding: 0 0 0 131px;
}
.breadCrumContainer a:hover{
  color: #cf4520;
}
.breadCrumContainer a:active{
  color: #cf4520;
}
.messageBox{
  display: grid;
    place-content: center;
    place-items: center;
    margin: auto;
    margin-top: 10%;

}
.messageContainer{
 display: grid;
 place-items: center;
 place-content: center;
}
.messageHeading{
  font-size: 35px;
  font-weight: bold;
  /* font-family: FedraSansStd-book; */
  letter-spacing: .5px;
  line-height: 1.2;
  text-align: center;
}
.messageDes{
 font-size: 20px;
 line-height: 26px;
 /* font-family: FedraSansStd-book; */
 text-align: center;
 margin-top: 15px;
}
.messageButton{
  display: flex;
  align-items: center;
   margin-top: 20px;
   padding: 10px 20px;
   font-size: 20px;
   background-color: teal;
   color: #fff;
   font-weight: 400;
   /* font-family: FedraSansStd-book; */
   border: none;
   outline: none;
   cursor: pointer;
}
</style>
</head>
<body>
  <section class='headerComponent'>
    <div class="topBar">
      <div class="container">
        <div class="topBarContent">
          <div class="tobBarItem">
            <div>
              <div class="tobBarLink dark" style="outline: 2px solid transparent;
              outline-offset: 2px;
              display: inline-block;
              font-size: 11px;
              padding: 12px 15px 13px 15px;
              background: #121212;
              text-transform: capitalize;">Sadhguru Exclusive</div>
              <div class="tobBarLink" style="padding: 12px 16px 12px 15px; ">About</div>

            </div>
            <img alt="User" src="/assets/images/icon-avatar.svg" loading="lazy" class="chakra-image css-1ngw63v" style="margin:0 9px 0 20px; float: right;">
          </div>
        </div>
      </div>
    </div>
    <header>
      <nav>
        <div class="logo" >
          <img src="/assets/images/logo.png"  alt="logo"
          title="logo"/>
          
        </div>
      </nav>
    </header>
    <div class="breadCrum">
      <div class="breadCrumContainer">
        <div class="breadCrumContent">
          <a>Home</a> &nbsp;/ &nbsp;
          <a>Events</a>&nbsp; / &nbsp;
          <a>Monthly</a>
        </div>
      </div>
    </div>
    <div class="messageBox">
      <div class="messageContainer">
        <h1 class="messageHeading">
          You are currently offline
        </h1>
        <p class="messageDes">
          We will try to reconnect in 5 second(s)...
        </p>
        <button class="messageButton" onclick="window.location.reload();">
          Reconnect
        </button>
        <p style="margin-top: 10px;" contenteditable>click the button to reload  the page</p>
      </div>
    </div>
  <script>
   function myFunction(x) {
  x.classList.toggle("fa-xmark");
  let logo = document.getElementById("logo");
  let navbar= document.getElementById("navbar");
    logo.classList.toggle("hide")
   
    navbar.classList.toggle("Active")
}
const reloadButton= document.querySelector('#reload');
function reload(){
  reload=location.reload();
}
reloadButton.addEventListener("click",reload,false)
  </script>
  </section>
  

</body>
</html>
